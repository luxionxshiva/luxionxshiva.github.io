<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mineloss Staff Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Mineloss Staff Application</h1>

    <form id="applicationForm">

        <!-- Section 1 -->
        <div class="card">
            <h2>Basic Information</h2>

            <input type="text" placeholder="Full Name" required>
            <input type="text" placeholder="Discord Username" required>
            <input type="text" placeholder="Minecraft Username" required>
            <input type="number" placeholder="Age" required>

            <select required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>

        <!-- Section 2 -->
        <div class="card">
            <h2>Experience & Skills</h2>

            <textarea placeholder="Past Experience" required></textarea>
            <input type="text" placeholder="Which Post You Want" required>
            <textarea placeholder="What You Can Do Better" required></textarea>
            <input type="text" placeholder="Time You Can Give Daily (e.g. 3-5 hours)" required>
            <input type="text" placeholder="Preferred Language" required>
            <textarea placeholder="Explain Yourself Properly" required></textarea>
        </div>

        <!-- Section 3 -->
        <div class="card">
            <h2>Server Knowledge & Requirements</h2>

            <textarea placeholder="Your Knowledge About Servers" required></textarea>
            <textarea placeholder="Your Knowledge About Mineloss Server" required></textarea>

            <label class="checkbox">
                <input type="checkbox" required>
                I have a clean and respectful reputation
            </label>

            <label class="checkbox">
                <input type="checkbox" required>
                No severe punishment in last 30 days
            </label>

            <label class="checkbox">
                <input type="checkbox" required>
                Minimum 5 hours playtime on server
            </label>
        </div>

        <button type="submit" class="submit-btn">Submit Application</button>

    </form>

    <p class="note">After clearing application, you will be called for an interview.</p>
</div>

<script src="script.js"></script>
</body>
</html>
